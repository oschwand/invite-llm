[project]
name = "invite-litellm"
version = "0.2.1"
description = "Self-service key management for a LiteLLM proxy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Olivier Schwander", email = "olivier.schwander@chadok.info" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[project.scripts]
invite-litellm = "invite_litellm:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
