<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>invite-llm</title>
  </head>
  <body>
    <main class="card" x-data="loginForm" x-cloak>
      <template x-if="session">
        <section>
          <h1>Signed in</h1>
          <p class="subtitle" x-text="session.user_email || session.user_id"></p>
          <dl>
            <div><dt>User ID</dt><dd x-text="session.user_id"></dd></div>
            <div><dt>Role</dt><dd x-text="session.user_role || 'unknown'"></dd></div>
            <div><dt>Session expires</dt><dd x-text="new Date(session.expires_at * 1000).toLocaleString()"></dd></div>
            <div><dt>Server</dt><dd x-text="serverUrl"></dd></div>
          </dl>
          <div class="token">
            <code x-text="session.token.slice(0, 24) + '…'"></code>
            <button type="button" @click="copyValue(session.token)" x-text="copiedValue === session.token ? 'Copied' : 'Copy token'"></button>
          </div>
          <section class="keys">
            <div class="keys-header">
              <h2>Virtual keys <span class="count" x-text="keys.length"></span></h2>
              <button type="button" class="small" @click="loadKeys()" :disabled="keysLoading" x-text="keysLoading ? 'Loading…' : 'Refresh'"></button>
            </div>
            <p class="error" x-show="keysError" x-text="keysError" role="alert"></p>
            <p class="empty" x-show="keysLoading && keys.length === 0">Loading keys…</p>
            <p class="empty" x-show="!keysLoading && !keysError && keys.length === 0">No virtual keys associated with this account.</p>
            <div class="table-wrap" x-show="keys.length > 0">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Key</th>
                    <th x-show="session.user_role !== 'internal_user'">Owner</th>
                    <th>Team</th>
                    <th>Spend</th>
                    <th>Budget</th>
                    <th>Expires</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="key in keys" :key="key.token">
                    <tr>
                      <td x-text="key.key_alias || '(unnamed)'"></td>
                      <td class="mono" x-text="key.key_name || '—'"></td>
                      <td class="mono" x-show="session.user_role !== 'internal_user'" :title="key.user_id || ''" x-text="key.user_id ? key.user_id.slice(0, 8) + '…' : '—'"></td>
                      <td class="wrap" :title="key.team_id || ''" x-text="teamName(key)"></td>
                      <td x-text="formatSpend(key)"></td>
                      <td x-text="formatBudget(key)"></td>
                      <td x-text="formatExpiry(key)"></td>
                      <td><span class="badge" :class="keyStatus(key)" x-text="keyStatus(key)"></span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
          <button type="button" class="primary" @click="logout()">Sign out</button>
        </section>
      </template>
      <template x-if="!session">
        <section>
          <h1>LiteLLM</h1>
          <p class="subtitle">Sign in to the proxy server</p>
          <form @submit.prevent="submit">
            <label>
              Server URL
              <input type="url" x-model="serverUrl" spellcheck="false" required />
            </label>
            <label>
              Username
              <input type="text" x-model="username" autocomplete="username" required autofocus />
            </label>
            <label>
              Password
              <input type="password" x-model="password" autocomplete="current-password" required />
            </label>
            <p class="error" x-show="error" x-text="error" role="alert"></p>
            <button class="primary" type="submit" :disabled="loading" x-text="loading ? 'Signing in…' : 'Sign in'"></button>
          </form>
        </section>
      </template>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
