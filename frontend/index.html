<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invite LiteLLM</title>
  </head>
  <body x-data="loginForm" x-cloak>
    <header class="banner">
      <span class="banner-title">Invite LiteLLM</span>
      <div class="banner-actions" x-show="session">
        <button type="button" class="banner-button" :class="{ active: view === 'keys' }" @click="view = 'keys'">Virtual keys</button>
        <button type="button" class="banner-button" :class="{ active: view === 'teams' }" x-show="isAdmin" @click="showTeams()">Teams</button>
        <button type="button" class="banner-button" :class="{ active: view === 'create-team' }" x-show="isAdmin" @click="showCreateTeam()">Create team</button>
        <button type="button" class="banner-button" :class="{ active: view === 'help' }" @click="view = 'help'">Help</button>
        <a class="banner-button" :href="serverUrl + '/ui'" target="_blank" rel="noopener">Go to LiteLLM Dashboard</a>
        <button type="button" class="banner-button" @click="logout()">Sign out</button>
      </div>
    </header>
    <div class="server-alert" x-show="serverUnreachable" x-cloak role="alert">
      <span>Cannot reach the LiteLLM server at <span class="mono" x-text="serverUrl"></span> — check that it is running.</span>
      <button type="button" class="link" @click="checkServer()">Retry</button>
    </div>
    <div class="page">
      <main class="card">
      <template x-if="session">
        <section>
          <h1 x-show="view !== 'help'">
            <span x-text="userAlias || session.user_email || session.user_id"></span>
            <span class="beside" x-show="userAlias && session.user_email" x-text="session.user_email"></span>
          </h1>
          <dl x-show="view !== 'help'">
            <div><dt>Role</dt><dd x-text="session.user_role || 'unknown'"></dd></div>
          </dl>
          <section class="keys" x-show="view === 'keys'">
            <div class="keys-header">
              <h2>Virtual keys <span class="count" x-text="keys.length"></span></h2>
              <button type="button" class="small" @click="loadKeys()" :disabled="keysLoading" x-text="keysLoading ? 'Loading…' : 'Refresh'"></button>
            </div>
            <p class="error" x-show="keysError" x-text="keysError" role="alert"></p>
            <p class="empty" x-show="keysLoading && keys.length === 0">Loading keys…</p>
            <p class="empty" x-show="!keysLoading && !keysError && keys.length === 0">No virtual keys associated with this account.</p>
            <div class="table-wrap" x-show="keys.length > 0">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Key</th>
                    <th x-show="session.user_role !== 'internal_user'">Owner</th>
                    <th>Team</th>
                    <th>Spend</th>
                    <th>Budget</th>
                    <th>Expires</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="key in keys" :key="key.token">
                    <tr>
                      <td data-label="Name" x-text="key.key_alias || '(unnamed)'"></td>
                      <td class="mono" data-label="Key" x-text="key.key_name || '—'"></td>
                      <td class="mono" data-label="Owner" x-show="session.user_role !== 'internal_user'" :title="key.user_id || ''" x-text="key.user_id ? key.user_id.slice(0, 8) + '…' : '—'"></td>
                      <td data-label="Team" :title="key.team_id || ''" x-text="teamName(key)"></td>
                      <td data-label="Spend" x-text="formatSpend(key)"></td>
                      <td data-label="Budget" x-text="formatBudget(key)"></td>
                      <td data-label="Expires" x-text="formatExpiry(key)"></td>
                      <td data-label="Status"><span class="badge" :class="keyStatus(key)" x-text="keyStatus(key)"></span></td>
                      <td data-label="Actions"><button type="button" class="small" @click="openRegenModal(key)">Regenerate</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
          <section class="keys" x-show="view === 'teams'" x-cloak>
            <div class="keys-header">
              <h2>Teams <span class="count" x-text="teams.length"></span></h2>
              <button type="button" class="small" @click="loadTeams()" :disabled="teamsLoading" x-text="teamsLoading ? 'Loading…' : 'Refresh'"></button>
            </div>
            <p class="error" x-show="teamsError" x-text="teamsError" role="alert"></p>
            <p class="empty" x-show="teamsLoading && teams.length === 0">Loading teams…</p>
            <p class="empty" x-show="!teamsLoading && !teamsError && teams.length === 0">No teams with an invite link found on this server.</p>
            <div class="table-wrap" x-show="teams.length > 0">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Keys</th>
                    <th>Team budget</th>
                    <th>Member budget</th>
                    <th>Spend</th>
                    <th>Invite link</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="team in teams" :key="team.team_id">
                    <tr>
                      <td data-label="Name" x-text="team.team_alias || '(unnamed)'"></td>
                      <td data-label="Keys" x-text="teamKeyCount(team)"></td>
                      <td data-label="Team budget" x-text="teamBudget(team)"></td>
                      <td data-label="Member budget" x-text="teamMemberBudget(team)"></td>
                      <td data-label="Spend" x-text="teamSpend(team)"></td>
                      <td data-label="Invite link">
                        <template x-if="teamInviteLink(team) === ''">
                          <span>—</span>
                        </template>
                        <template x-if="teamInviteLink(team) !== ''">
                          <span class="invite-cell">
                            <a class="mono" :href="teamInviteLink(team)" target="_blank" rel="noopener" :title="teamInviteLink(team)" x-text="team.invite_code"></a>
                            <button type="button" class="link" @click="copyValue(teamInviteLink(team))" x-text="copiedValue === teamInviteLink(team) ? 'Copied' : 'Copy'"></button>
                          </span>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
          <section class="keys" x-show="view === 'help'" x-cloak>
            <div class="keys-header">
              <h2>Help</h2>
            </div>

            <h3>Calling the proxy from Python</h3>
            <p>
              Use any virtual key from the <em>Virtual keys</em> table as the API key of a standard
              OpenAI client, pointing it at this proxy server
              (<span class="mono" x-text="serverUrl"></span>). The proxy forwards requests to the
              real model providers and tracks the spend of each key.
            </p>
            <pre class="code-block"><code x-text="pythonExample"></code></pre>
            <p>
              The proxy speaks the standard OpenAI HTTP API, so any OpenAI-compatible client
              library, in any language, can be used the same way — provided it is pointed at the
              proxy URL (<span class="mono" x-text="serverUrl"></span>) with a virtual key.
            </p>

            <h3>How budgets work</h3>
            <ul>
              <li>
                Every virtual key has a <strong>spend</strong>, counted in US dollars by the proxy
                on each request, and an optional <strong>budget</strong> (USD). Once a key's spend
                reaches its budget, the proxy rejects further requests made with that key. Keys
                without a budget show <em>No limit</em> in the table.
              </li>
              <li>
                A <strong>team budget</strong> caps the combined spend of all the keys belonging to
                a team — once the team total is reached, every key of the team stops working, even
                keys with remaining individual budget.
              </li>
              <li>
                A <strong>team member budget</strong> is the default budget automatically given to
                the virtual key created when someone joins the team through an invite link. Team
                admins set it when creating the team; it is shown as <em>Member budget</em> in the
                Teams table and as <em>Default key budget</em> in the invitation page.
              </li>
              <li>
                The <em>Spend</em> and <em>Budget</em> columns of the Virtual keys table (and the
                <em>Spend</em> column of the Teams table) always show the current values tracked by
                the proxy. Regenerating a key keeps its budget and accumulated spend.
              </li>
            </ul>
          </section>
          <section class="keys" x-show="view === 'create-team'" x-cloak>
            <div class="keys-header">
              <h2>Create a new team</h2>
            </div>
            <template x-if="createdInviteLink === ''">
              <form @submit.prevent="createTeam()">
                <label>
                  Team name
                  <input type="text" x-model="newTeamName" required />
                </label>
                <label>
                  Team member budget (USD, optional)
                  <input type="number" x-model="newTeamMemberBudget" step="any" inputmode="decimal" placeholder="Default budget given to each team member's keys" />
                </label>
                <label>
                  Max team budget (USD, optional)
                  <input type="number" x-model="newTeamMaxBudget" step="any" inputmode="decimal" placeholder="Total spend limit for the whole team" />
                </label>
                <label class="checkbox">
                  <input type="checkbox" x-model="newTeamInviteLink" />
                  Create invite link
                </label>
                <p class="error" x-show="createTeamError" x-text="createTeamError" role="alert"></p>
                <button class="primary" type="submit" :disabled="creatingTeam" x-text="creatingTeam ? 'Creating…' : 'Create team'"></button>
              </form>
            </template>
            <template x-if="createdInviteLink !== ''">
              <div>
                <p class="empty">
                  Team created. Share this invite link — people can use it to join
                  <strong x-text="createdTeamName"></strong>:
                </p>
                <div class="token">
                  <code><a :href="createdInviteLink" target="_blank" rel="noopener" x-text="createdInviteLink"></a></code>
                  <button type="button" @click="copyValue(createdInviteLink)" x-text="copiedValue === createdInviteLink ? 'Copied' : 'Copy'"></button>
                </div>
                <div class="modal-actions">
                  <button type="button" @click="showCreateTeam()">Create another team</button>
                  <button type="button" class="primary" @click="view = 'teams'">View teams</button>
                </div>
              </div>
            </template>
          </section>
        </section>
      </template>
      <template x-if="!session">
        <section>
          <h1>LiteLLM</h1>
          <p class="subtitle">Sign in to the proxy server</p>
          <form @submit.prevent="submit">
            <label>
              Username
              <input type="text" x-model="username" autocomplete="username" required autofocus />
            </label>
            <label>
              Password
              <input type="password" x-model="password" autocomplete="current-password" required />
            </label>
            <p class="error" x-show="error" x-text="error" role="alert"></p>
            <button class="primary" type="submit" :disabled="loading" x-text="loading ? 'Signing in…' : 'Sign in'"></button>
          </form>
        </section>
      </template>
    </main>
    </div>

    <div class="modal-backdrop" x-show="regenKey !== null" x-cloak @keydown.escape.window="closeRegenModal()">
      <div class="modal" @click.outside="closeRegenModal()">
        <template x-if="regenKey">
          <div>
            <h2 x-text="regenStage === 'done' ? 'Key regenerated' : 'Regenerate key?'"></h2>
            <p class="subtitle" x-text="regenKey.key_alias || regenKey.key_name || 'Key'"></p>

            <template x-if="regenStage !== 'done'">
              <div>
                <p class="warning">
                  The previous key will be <strong>deleted</strong> and a new one created with the same name and
                  settings (owner, team, budget, limits, models, metadata). Applications still using the old key
                  will stop working immediately.
                </p>
                <p class="error" x-show="regenError" x-text="regenError" role="alert"></p>
                <div class="modal-actions">
                  <button type="button" @click="closeRegenModal()" :disabled="regenStage === 'working'">Cancel</button>
                  <button type="button" class="primary danger" @click="confirmRegenerate()" :disabled="regenStage === 'working'" x-text="regenStage === 'working' ? 'Regenerating…' : 'Regenerate'"></button>
                </div>
              </div>
            </template>

            <template x-if="regenStage === 'done'">
              <div>
                <p class="warning" x-show="regenWarning" x-text="regenWarning" role="alert"></p>
                <p>
                  The previous key has been deleted. Here is the new key —
                  <strong>it will not be shown again</strong>:
                </p>
                <div class="token">
                  <code x-text="newKeyValue"></code>
                  <button type="button" @click="copyValue(newKeyValue)" x-text="copiedValue === newKeyValue ? 'Copied' : 'Copy'"></button>
                </div>
                <div class="modal-actions">
                  <button type="button" class="primary" @click="closeRegenModal()">Done</button>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <div class="modal-backdrop" x-show="inviteTeamId !== ''" x-cloak @keydown.escape.window="closeInviteModal()">
      <div class="modal" @click.outside="closeInviteModal()">
        <template x-if="inviteTeamId !== ''">
          <div>
            <h2>Team invitation</h2>
            <p class="subtitle">
              You have been invited to join
              <strong x-text="inviteTeamName || inviteTeamId"></strong>.
            </p>
            <dl>
              <div>
                <dt>Default key budget</dt>
                <dd x-text="inviteMemberBudget === null ? '—' : formatUsd(inviteMemberBudget)"></dd>
              </div>
            </dl>

            <template x-if="inviteStage === 'done'">
              <div>
                <p class="empty" x-show="inviteKeyValue !== ''">
                  Invite accepted. Here is your new virtual key —
                  <strong>it will not be shown again</strong>:
                </p>
                <p class="empty" x-show="inviteKeyValue === ''">Invite accepted.</p>
                <div class="token" x-show="inviteKeyValue !== ''">
                  <code x-text="inviteKeyValue"></code>
                  <button type="button" @click="copyValue(inviteKeyValue)" x-text="copiedValue === inviteKeyValue ? 'Copied' : 'Copy'"></button>
                </div>
                <div class="modal-actions">
                  <button type="button" class="primary" @click="closeInviteModal()">Done</button>
                </div>
              </div>
            </template>

            <template x-if="inviteStage !== 'done' && session">
              <div>
                <p class="error" x-show="inviteError" x-text="inviteError" role="alert"></p>
                <div class="modal-actions">
                  <button type="button" class="primary" :disabled="inviteWorking" @click="acceptInvite()" x-text="inviteWorking ? 'Accepting…' : 'Accept the invite and create virtual key'"></button>
                </div>
              </div>
            </template>

            <template x-if="inviteStage !== 'done' && !session">
              <div>
                <div class="tabs">
                  <button type="button" :class="{ active: inviteTab === 'signin' }" @click="inviteTab = 'signin'">Sign in</button>
                  <button type="button" :class="{ active: inviteTab === 'create' }" @click="inviteTab = 'create'">Create account</button>
                </div>
                <form x-show="inviteTab === 'signin'" @submit.prevent="submit()">
                  <label>
                    Email
                    <input type="email" x-model="username" autocomplete="email" required />
                  </label>
                  <label>
                    Password
                    <input type="password" x-model="password" autocomplete="current-password" required />
                  </label>
                  <p class="error" x-show="error" x-text="error" role="alert"></p>
                  <button class="primary" type="submit" :disabled="loading" x-text="loading ? 'Signing in…' : 'Sign in'"></button>
                </form>
                <form x-show="inviteTab === 'create'" @submit.prevent="createInviteAccount()">
                  <label>
                    Full name
                    <input type="text" x-model="inviteFullName" autocomplete="name" required />
                  </label>
                  <label>
                    Email
                    <input type="email" x-model="inviteEmail" autocomplete="email" required />
                  </label>
                  <label>
                    Password
                    <input type="password" x-model="invitePassword" autocomplete="new-password" required />
                  </label>
                  <p class="error" x-show="inviteError" x-text="inviteError" role="alert"></p>
                  <button class="primary" type="submit" :disabled="inviteWorking" x-text="inviteWorking ? 'Creating…' : 'Create account and join'"></button>
                </form>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>

    <footer class="footer">
      <a href="https://github.com/oschwand/invite-llm" target="_blank" rel="noopener">Invite-LiteLLM</a>
      <span class="mono" x-show="appVersion" x-cloak x-text="'v' + appVersion"></span>
      <span>Connected to <a class="mono" :href="serverUrl" target="_blank" rel="noopener" x-text="serverUrl"></a></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
